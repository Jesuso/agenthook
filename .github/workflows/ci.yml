name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: ensure sshd is present (test/_sshd-helpers.js, #861)
        run: |
          if ! command -v sshd >/dev/null 2>&1 && [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update && sudo apt-get install -y openssh-server openssh-client
          fi
      - name: typecheck (JSDoc + checkJs)
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: syntax check (node --check)
        run: |
          status=0
          for f in $(find bin src -name '*.js'); do
            node --check "$f" || status=1
          done
          exit $status
      - name: typecheck (ui)
        run: npm run typecheck:ui
      - name: tests (ui)
        run: npm run test:ui
      - name: build (ui)
        run: npm run build:ui
      - name: license check
        run: |
          npx --yes license-checker-rseidelsohn \
            --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC' \
            --excludePackagesStartingWith 'lightningcss;@jesuso/agenthook'
          # lightningcss (MPL-2.0) is a build-only transitive of vite@8 and
          # @tailwindcss/node; it never lands in ui/dist, so it's excluded by
          # name rather than widening --onlyAllow. Any other non-allowlisted
          # license still fails this step.

  # Real-browser horizontal-overflow check: serves the built UI over a seeded fixture registry
  # in headless Chromium and fails if the page or a guarded scroll container scrolls sideways
  # at desktop widths (test/ui-overflow/check.mjs; docs/web-ui.md). Own job so the browser
  # download never slows the matrix; a skip (no browser) is a red job here (CI set).
  ui-overflow:
    runs-on: ubuntu-latest
    name: ui overflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # playwright-core is pinned in devDependencies — bump this key when you bump it.
          key: playwright-core-1.65.1-${{ runner.os }}
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm run check:overflow

  # The packed tarball, installed like a user would, running docs/quickstart.md verbatim with a
  # stub agent, plus the failure tour, the CLI's own remedy hints, restart, teardown and an
  # upgrade from the latest published version. See test/release/smoke.mjs.
  release-smoke:
    runs-on: ubuntu-latest
    name: release smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:smoke -- --upgrade-from latest --json release-smoke.json
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke
          path: release-smoke.json
